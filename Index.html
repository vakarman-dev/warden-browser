<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warden Browser — Privacy-Hardened C++20 Web Browser</title>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: rgba(22, 27, 34, 0.72);
      --border-color: #2a2f37;
      --border-glow: rgba(74, 144, 226, 0.5);
      --accent-blue: #4a90e2;
      --accent-cyan: #00d2ff;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-container {
      max-width: 1160px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }

    .brand {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-primary); font-weight: 700; font-size: 1.2rem; cursor: pointer;
    }

    .brand img, .brand svg { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; }

    .badge-oss {
      font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 999px;
      background: rgba(74, 144, 226, 0.15); color: var(--accent-cyan);
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .nav-right { display: flex; align-items: center; gap: 18px; }
    .nav-links { display: flex; align-items: center; gap: 22px; }
    .nav-links a { color: var(--text-secondary); font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-primary); }

    .btn-github {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px;
      background: #161b22; border: 1px solid var(--border-color); color: var(--text-primary);
      text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s ease;
    }
    .btn-github:hover { border-color: var(--accent-blue); background: #1f2630; }

    .lang-dropdown { position: relative; }
    .lang-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px;
      background: #161b22; border: 1px solid var(--border-color); color: var(--text-primary);
      cursor: pointer; font-size: 0.9rem; font-weight: 600;
    }
    .lang-btn:hover { border-color: var(--accent-blue); }
    .lang-arrow { font-size: 0.75rem; color: var(--text-secondary); transition: transform 0.25s ease; }
    .lang-dropdown.open .lang-arrow { transform: rotate(180deg); }

    .lang-menu {
      position: absolute; right: 0; top: calc(100% + 8px); min-width: 155px;
      background: #161b22; border: 1px solid var(--border-color); border-radius: 10px; padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55); opacity: 0; visibility: hidden;
      transform: translateY(-6px); transition: all 0.2s ease; z-index: 200;
    }
    .lang-dropdown.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0); }

    .lang-option {
      width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border: none; background: transparent; color: var(--text-primary); font-size: 0.9rem;
      border-radius: 7px; cursor: pointer; text-align: left;
    }
    .lang-option:hover { background: rgba(74, 144, 226, 0.15); }
    .lang-option.active { background: rgba(74, 144, 226, 0.22); color: var(--accent-cyan); font-weight: 600; }
    .flag-icon { width: 20px; height: 14px; border-radius: 2px; flex-shrink: 0; }

    main { position: relative; z-index: 1; flex: 1; max-width: 1160px; width: 100%; margin: 0 auto; padding: 0 24px; }
    .hidden-view { display: none; }

    .hero {
      min-height: calc(100vh - 70px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 60px 0 40px;
    }
    .hero-logo { width: 96px; height: 96px; margin-bottom: 24px; filter: drop-shadow(0 0 28px rgba(74, 144, 226, 0.45)); }
    .hero h1 {
      font-size: clamp(2.1rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.15; margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-blue) 65%, var(--accent-cyan) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; max-width: 850px;
    }
    .hero p { font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--text-secondary); max-width: 680px; line-height: 1.65; margin-bottom: 42px; }

    .scroll-hint { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
    .scroll-hint:hover { color: var(--accent-cyan); }

    .features-section { padding: 70px 0; }
    .section-title { text-align: center; font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 700; margin-bottom: 46px; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; }

    .feature-card {
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 28px; transition: all 0.25s ease;
    }
    .feature-card:hover { border-color: var(--border-glow); transform: translateY(-5px); }
    .feature-icon {
      width: 46px; height: 46px; border-radius: 12px; background: rgba(74, 144, 226, 0.14);
      border: 1px solid rgba(74, 144, 226, 0.3); display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem; margin-bottom: 18px;
    }
    .feature-card h3 { font-size: 1.18rem; margin-bottom: 10px; }
    .feature-card p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; }

    .download-section { padding: 60px 0 100px; text-align: center; }
    .download-box {
      background: linear-gradient(145deg, rgba(22, 27, 34, 0.92), rgba(16, 22, 32, 0.95));
      border: 1px solid var(--border-color); border-radius: 22px; padding: 54px 28px;
      max-width: 760px; margin: 0 auto; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .download-box h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 14px; }
    .download-box p { color: var(--text-secondary); margin-bottom: 32px; font-size: 1.05rem; }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 34px; font-size: 1.05rem; font-weight: 700; color: #ffffff;
      background: linear-gradient(135deg, var(--accent-blue), #2563eb); border: none;
      border-radius: 12px; cursor: pointer; text-decoration: none;
      box-shadow: 0 0 25px rgba(74, 144, 226, 0.45); transition: all 0.25s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(0, 210, 255, 0.65); }

    .status-page { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 40px 0; }
    .status-card {
      background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-color);
      border-radius: 24px; padding: 52px 32px; max-width: 680px; width: 100%; text-align: center;
    }
    .dev-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 999px;
      background: rgba(234, 179, 8, 0.14); border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15; font-weight: 700; font-size: 0.9rem; margin-bottom: 24px;
    }
    .status-card h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 18px; }
    .status-card p { color: var(--text-secondary); font-size: 1.05rem; line-height: 1.65; margin-bottom: 34px; }
    .status-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 26px; font-size: 1rem; font-weight: 600; color: var(--text-primary);
      background: #161b22; border: 1px solid var(--border-color); border-radius: 12px; cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--text-secondary); background: #1f2630; }

    footer {
      position: relative; z-index: 1; border-top: 1px solid var(--border-color);
      padding: 26px 24px; text-align: center; color: var(--text-secondary); font-size: 0.92rem;
    }
    footer a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }

    @media (max-width: 680px) {
      .nav-links { display: none; }
      .btn-github span { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <header>
    <div class="nav-container">
      <div class="brand" onclick="showMainView()">
        <img src="resources/warden.png" alt="Warden Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';" />
        <svg id="fallback-logo" style="display:none;" viewBox="0 0 64 64" fill="none">
          <path d="M32 4L10 14V30C10 45.2 19.4 58.8 32 62C44.6 58.8 54 45.2 54 30V14L32 4Z" fill="#4a90e2"/>
          <path d="M21 24L26 42L32 30L38 42L43 24" stroke="#0d1117" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Warden Browser</span>
        <span class="badge-oss">Open Source</span>
      </div>

      <div class="nav-right">
        <nav class="nav-links">
