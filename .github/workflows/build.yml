name: Build Warden Browser

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.0'

jobs:
  build-windows:
    name: Windows (Qt 6.8.0)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebengine qtwebchannel qtpositioning'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Install and Locate OpenSSL (Windows)
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL-Win64",
            "C:\tools\OpenSSL-Win64"
          )
          $sslDir = $candidates | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $sslDir) {
            $foundHeader = Get-ChildItem -Path "C:\" -Filter "ssl.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundHeader) {
              $sslDir = Split-Path (Split-Path $foundHeader.DirectoryName -Parent) -Parent
            }
          }
          Write-Host "Found OpenSSL at: $sslDir"
          "OPENSSL_ROOT_DIR=$sslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sslDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        shell: pwsh
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR"

      - name: Build project (Windows)
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt and copy resources (Windows)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build\Release" -Filter *.exe | Where-Object { $_.Name -notmatch 'qml|WebEngine' } | Select-Object -First 1
          if (-not $exe) { Write-Error "No executable found in build\Release" }
          windeployqt --release --no-translations $exe.FullName
          Get-ChildItem -Path "$env:OPENSSL_ROOT_DIR" -Filter "*.dll" -Recurse | Copy-Item -Destination "build\Release\" -Force
          if (Test-Path "resources") { Copy-Item -Recurse -Force "resources" "build\Release\resources" }
          if (Test-Path "cloud_config.json") { Copy-Item -Force "cloud_config.json" "build\Release\cloud_config.json" }


      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WardenBrowser-Windows
          path: build/Release/**
          if-no-files-found: error

  build-linux:
    name: Linux (Qt 6.8.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgl1-mesa-dev libssl-dev libcups2-dev libxkbcommon-x11-0 libnss3 libdbus-1-3 libxcb-cursor0 libegl1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libpci3 libxkbfile1 libfontconfig1 libfreetype6 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libxrender1 libxi6 libsm6 libice6
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure and build (Linux)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: Package .deb
        working-directory: build
        continue-on-error: true
        run: cpack -G DEB

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: WardenBrowser-Linux
          path: |
            build/*.deb
            build/WardenBrowser
          if-no-files-found: warn
